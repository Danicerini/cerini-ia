# Compila l'APK di Aura, a comando. Indirizzo del server e chiave di firma stanno nei segreti del repo (tools/android_secrets.sh):
# senza, controlla solo che il codice compili. Dopo la compilazione: tools/publish_android.sh lo carica sul server.
name: App Android
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compila e firma
        env:
          AURA_URL: ${{ secrets.AURA_URL }}
          AURA_KEY_B64: ${{ secrets.AURA_KEY_B64 }}
          AURA_KEY_PASS: ${{ secrets.AURA_KEY_PASS }}
        run: |
          if [ -n "$AURA_KEY_B64" ]; then
            echo "$AURA_KEY_B64" | base64 -d > "$RUNNER_TEMP/aura.p12"
            export AURA_KEYSTORE="$RUNNER_TEMP/aura.p12"
          fi
          cd android
          gradle --no-daemon assembleRelease
          if [ -z "$AURA_KEY_B64" ]; then echo "Compila, ma senza chiave di firma non c'è un APK da installare"; exit 0; fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/aura.apk"
          echo "$GITHUB_RUN_NUMBER" > "$GITHUB_WORKSPACE/aura.version"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-android
          path: |
            aura.apk
            aura.version
          retention-days: 30
          if-no-files-found: ignore
