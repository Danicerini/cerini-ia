<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
@font-face { font-family: "Geist"; src: url(/static/vendor/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(/static/vendor/fonts/GeistMono-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
/* ------------------------------------------------------------------ tokens */
:root {
  color-scheme: light;
  --bg: oklch(0.99 0.002 260);
  --side: oklch(0.972 0.003 260);
  --raised: oklch(1 0 0);
  --hover: oklch(0.94 0.004 260);
  --active: oklch(0.915 0.005 260);
  --border: oklch(0.905 0.004 260);
  --border-strong: oklch(0.84 0.006 260);
  --text: oklch(0.22 0.008 260);
  --text-2: oklch(0.44 0.01 260);
  --text-3: oklch(0.54 0.01 260);
  --bubble: oklch(0.948 0.004 260);
  --code-bg: oklch(0.965 0.003 260);
  --accent: oklch(0.52 0.15 262);
  --accent-soft: oklch(0.52 0.15 262 / 0.12);
  --ok: oklch(0.6 0.15 150);
  --warn: oklch(0.7 0.15 70);
  --err: oklch(0.56 0.19 25);
  --err-soft: oklch(0.56 0.19 25 / 0.08);
  --scrim: oklch(0.2 0.01 260 / 0.35);
  --shadow: 0 12px 32px -8px oklch(0.2 0.02 260 / 0.18), 0 2px 6px oklch(0.2 0.02 260 / 0.06);
  --primary-bg: oklch(0.22 0.008 260);
  --primary-fg: oklch(0.99 0 0);
  /* syntax */
  --hl-kw: oklch(0.5 0.17 300); --hl-str: oklch(0.5 0.12 150); --hl-num: oklch(0.55 0.14 50);
  --hl-fn: oklch(0.5 0.14 255); --hl-com: oklch(0.58 0.01 260); --hl-type: oklch(0.52 0.12 200);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: oklch(0.205 0.004 260); --side: oklch(0.175 0.004 260); --raised: oklch(0.245 0.005 260);
    --hover: oklch(0.265 0.005 260); --active: oklch(0.3 0.006 260); --border: oklch(0.3 0.005 260);
    --border-strong: oklch(0.38 0.006 260); --text: oklch(0.94 0.003 260); --text-2: oklch(0.76 0.006 260);
    --text-3: oklch(0.66 0.006 260); --bubble: oklch(0.275 0.005 260); --code-bg: oklch(0.17 0.004 260);
    --accent: oklch(0.72 0.12 262); --accent-soft: oklch(0.72 0.12 262 / 0.16); --ok: oklch(0.72 0.16 150);
    --warn: oklch(0.8 0.14 75); --err: oklch(0.7 0.17 25); --err-soft: oklch(0.7 0.17 25 / 0.1);
    --scrim: oklch(0 0 0 / 0.5); --shadow: 0 16px 40px -8px oklch(0 0 0 / 0.55), 0 2px 8px oklch(0 0 0 / 0.3);
    --primary-bg: oklch(0.94 0.003 260); --primary-fg: oklch(0.2 0.004 260);
    --hl-kw: oklch(0.76 0.13 305); --hl-str: oklch(0.78 0.12 145); --hl-num: oklch(0.8 0.12 60);
    --hl-fn: oklch(0.77 0.11 250); --hl-com: oklch(0.6 0.01 260); --hl-type: oklch(0.78 0.1 195);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: oklch(0.205 0.004 260); --side: oklch(0.175 0.004 260); --raised: oklch(0.245 0.005 260);
  --hover: oklch(0.265 0.005 260); --active: oklch(0.3 0.006 260); --border: oklch(0.3 0.005 260);
  --border-strong: oklch(0.38 0.006 260); --text: oklch(0.94 0.003 260); --text-2: oklch(0.76 0.006 260);
  --text-3: oklch(0.66 0.006 260); --bubble: oklch(0.275 0.005 260); --code-bg: oklch(0.17 0.004 260);
  --accent: oklch(0.72 0.12 262); --accent-soft: oklch(0.72 0.12 262 / 0.16); --ok: oklch(0.72 0.16 150);
  --warn: oklch(0.8 0.14 75); --err: oklch(0.7 0.17 25); --err-soft: oklch(0.7 0.17 25 / 0.1);
  --scrim: oklch(0 0 0 / 0.5); --shadow: 0 16px 40px -8px oklch(0 0 0 / 0.55), 0 2px 8px oklch(0 0 0 / 0.3);
  --primary-bg: oklch(0.94 0.003 260); --primary-fg: oklch(0.2 0.004 260);
  --hl-kw: oklch(0.76 0.13 305); --hl-str: oklch(0.78 0.12 145); --hl-num: oklch(0.8 0.12 60);
  --hl-fn: oklch(0.77 0.11 250); --hl-com: oklch(0.6 0.01 260); --hl-type: oklch(0.78 0.1 195);
}

/* -------------------------------------------------------------------- base */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 "Geist", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
::selection { background: var(--accent-soft); color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
.hidden { display: none !important; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 16px; height: 16px; }
.mono, code, pre, kbd { font-family: "Geist Mono", ui-monospace, Consolas, monospace; }
.tnum { font-variant-numeric: tabular-nums; }

.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: var(--text-2);
  transition: background .15s, color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.icon-btn.sm { width: 30px; height: 30px; border-radius: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--border-strong); background: var(--raised); font-weight: 500; font-size: 14px;
  transition: background .15s, border-color .15s, opacity .15s; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
.btn.primary:hover:not(:disabled) { opacity: .88; background: var(--primary-bg); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ok) 20%, transparent); }
.dot.err { background: var(--err); }
.dot.warn { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------- login */
/* Accesso: a sinistra il pannello col marchio (anelli che partono dal punto del logo), a destra il modulo */
.auth { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.auth-art {
  --art-bg: oklch(0.19 0.012 262); --art-fg: oklch(0.97 0.003 262); --art-mute: oklch(0.76 0.012 262); --art-dot: oklch(0.74 0.13 262);
  position: relative; overflow: hidden; background: var(--art-bg); color: var(--art-fg);
  display: flex; flex-direction: column; justify-content: space-between; padding: 36px 44px 44px;
}
.auth-art .brand { color: var(--art-fg); font-size: 16px; }
.auth-art .brand-mark { background: var(--art-fg); color: var(--art-bg); }
.auth-art .rings { position: absolute; top: 50%; right: -26%; width: min(115%, 860px); aspect-ratio: 1; transform: translateY(-62%); pointer-events: none; }
.rings path { fill: none; stroke: var(--art-fg); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ring-in 1.6s cubic-bezier(.16, 1, .3, 1) forwards; }
.rings circle { fill: var(--art-dot); transform-origin: 200px 200px; animation: dot-in .9s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes ring-in { to { stroke-dashoffset: 0; } }
@keyframes dot-in { from { transform: scale(0); opacity: 0; } }
.art-copy { position: relative; max-width: 30ch; }
.art-copy h2 { font-size: clamp(34px, 3.6vw, 52px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 600; margin: 0 0 18px; text-wrap: balance; }
.art-copy p { margin: 0; color: var(--art-mute); font-size: 15px; line-height: 1.55; max-width: 38ch; }
.auth-main { display: grid; place-items: center; padding: 32px 20px; background: var(--bg); }
.login-box { width: 100%; max-width: 380px; }
.login-box > .brand { display: none; }
.pw-wrap { position: relative; }
.pw-wrap input { width: 100%; padding-right: 46px; }
.pw-wrap button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--text-3); }
.pw-wrap button:hover { color: var(--text); background: var(--hover); }
@media (max-width: 820px) {
  .auth { grid-template-columns: 1fr; }
  .auth-art { display: none; }
  .login-box > .brand { display: flex; }
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary-bg); color: var(--primary-fg); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; }
.login-box h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.03em; font-weight: 600; margin: 0 0 8px; }
.login-box > .brand + h1 { margin-top: 40px; }
.login-box p { margin: 0 0 32px; color: var(--text-2); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 500; color: var(--text-2); }
.field input {
  height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--raised);
  font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.login-box .btn { width: 100%; height: 46px; border-radius: 12px; margin-top: 10px; font-size: 15px; }
.login-box .field input { width: 100%; height: 46px; }
.form-err { color: var(--err); font-size: 14px; min-height: 22px; margin-top: 12px; }

/* --------------------------------------------------------------------- app */
#app { height: var(--app-h, 100dvh); display: flex; }
#side {
  width: 272px; flex: none; background: var(--side); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; transition: margin-left .25s cubic-bezier(.16,1,.3,1);
}
#app.side-collapsed #side { margin-left: -272px; }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 4px 16px; height: 56px; }
.new-chat {
  margin: 6px 10px 10px; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px;
  font-weight: 500; font-size: 14px; color: var(--text);
}
.new-chat:hover { background: var(--hover); }
.new-chat kbd { margin-left: auto; font-size: 11px; color: var(--text-3); }
#chatList { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
.group-label { font-size: 12px; font-weight: 500; color: var(--text-3); padding: 14px 10px 4px; }
.chat-item {
  position: relative; display: flex; align-items: center; height: 36px; border-radius: 9px; padding: 0 4px 0 10px;
  font-size: 14px; color: var(--text); cursor: pointer;
}
.chat-item:hover { background: var(--hover); }
.chat-item.active { background: var(--active); }
.chat-item .pin-mark { display: inline-grid; place-items: center; color: var(--text-3); margin-right: 6px; }
.chat-item .pin-mark .i { width: 14px; height: 14px; }
.chat-item:hover .pin-mark, .chat-item.active .pin-mark { display: none; }
.chat-item .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item .acts { display: none; gap: 0; }
.chat-item:hover .acts, .chat-item.active .acts, .chat-item.confirm .acts { display: flex; }
.chat-item .icon-btn { width: 28px; height: 28px; border-radius: 7px; }
.chat-item .icon-btn:hover { background: var(--border); }
.chat-item.confirm { background: var(--err-soft); }
.chat-item.confirm .t { color: var(--err); }
.chat-item input { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--accent); border-radius: 7px; background: var(--raised); padding: 0 8px; font-size: 14px; }
.chat-item input:focus { outline: none; }
.side-empty { color: var(--text-3); font-size: 13px; padding: 16px 10px; }
.side-foot { border-top: 1px solid var(--border); padding: 10px; display: grid; gap: 2px; }
.pc-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 13px; }
.pc-row .lbl { font-weight: 500; color: var(--text); }
.pc-row .sub { color: var(--text-3); font-size: 12px; }
.foot-actions { display: flex; align-items: center; gap: 2px; padding: 0 4px; }
.foot-actions .user { flex: 1; font-size: 13px; color: var(--text-2); padding-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px; }
.topbar .grow { flex: 1; }
#modelBtn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px 0 12px; border-radius: 10px;
  font-weight: 600; font-size: 15px; letter-spacing: -0.01em; max-width: min(60vw, 420px);
}
#modelBtn:hover, #modelBtn[aria-expanded="true"] { background: var(--hover); }
#modelBtn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#modelBtn .i { color: var(--text-3); }
#sideOpen { display: none; }
#app.side-collapsed #sideOpen { display: inline-grid; }

/* picker */
#picker {
  position: absolute; top: 52px; left: 10px; z-index: 30; width: min(400px, calc(100vw - 20px));
  background: var(--raised); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
  padding: 6px; max-height: min(70dvh, 560px); overflow-y: auto;
  transform-origin: top left; animation: pop .18s cubic-bezier(.16,1,.3,1);
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.picker-head { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 10px 6px; font-size: 12px; color: var(--text-3); font-weight: 500; }
.m-row { display: grid; grid-template-columns: 20px 1fr auto; gap: 4px 10px; align-items: start; padding: 10px; border-radius: 11px; cursor: pointer; }
.m-row:hover { background: var(--hover); }
.m-row .check { color: var(--text); margin-top: 2px; visibility: hidden; }
.m-row.sel .check { visibility: visible; }
.m-row .nm { font-weight: 500; font-size: 14px; word-break: break-all; }
.m-row .meta { font-size: 12.5px; color: var(--text-3); }
.m-row .side-act { align-self: center; }
.m-row .mem { grid-column: 2 / 4; display: grid; gap: 6px; margin-top: 4px; }
.mem-bar { height: 4px; border-radius: 4px; background: var(--border); overflow: hidden; display: flex; }
.mem-bar .g { background: var(--ok); }
.mem-bar .c { background: var(--warn); }
.mem-txt { font-size: 12px; color: var(--text-2); display: flex; gap: 12px; flex-wrap: wrap; }
.mem-txt b { font-weight: 500; color: var(--text); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; background: color-mix(in oklch, var(--ok) 14%, transparent); color: var(--ok); }
.picker-foot { display: flex; align-items: center; gap: 8px; margin: 4px 4px 2px; padding: 10px 8px 6px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-3); }
.picker-foot .pf-state { margin-left: auto; }
.picker-empty { padding: 18px 12px; color: var(--text-2); font-size: 14px; display: grid; gap: 12px; justify-items: start; }

/* thread */
#scroller { flex: 1; overflow-y: auto; overflow-anchor: none; }
#thread { max-width: 780px; margin: 0 auto; padding: 12px 20px 40px; display: flex; flex-direction: column; gap: 28px; }
.msg { position: relative; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .bubble {
  background: var(--bubble); border-radius: 20px; padding: 10px 16px; max-width: min(85%, 620px);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.user .imgs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 6px; }
.msg.user .imgs img { width: 120px; height: 120px; object-fit: cover; border-radius: 14px; border: 1px solid var(--border); }
.msg-actions, .think summary, .tool-card, .cp-label, .sv-id { -webkit-user-select: none; user-select: none; }
.msg-actions { display: flex; align-items: center; gap: 2px; margin-top: 6px; min-height: 30px; color: var(--text-3); opacity: 0; transition: opacity .15s; }
.msg:hover .msg-actions, .msg.last .msg-actions, .msg-actions:focus-within { opacity: 1; }
.msg-actions .stats { font-size: 12px; margin-left: 8px; }
.msg.user .msg-actions { justify-content: flex-end; }
.edit-box { width: min(100%, 620px); background: var(--bubble); border-radius: 20px; padding: 12px; }
.edit-box textarea { width: 100%; border: 0; background: transparent; resize: none; font-size: 16px; line-height: 1.55; min-height: 60px; }
.edit-box textarea:focus { outline: none; }
.edit-box .row { display: flex; justify-content: flex-end; gap: 8px; }

.think { margin-bottom: 10px; }
.think summary {
  list-style: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13.5px;
  color: var(--text-2); padding: 2px 0; user-select: none;
}
.think summary::-webkit-details-marker { display: none; }
.think summary .i { transition: transform .2s; }
.think[open] summary .chev { transform: rotate(180deg); }
.think .body { margin: 8px 0 4px; padding-left: 14px; border-left: 1px solid var(--border-strong); color: var(--text-2); font-size: 13.5px; line-height: 1.5; max-height: 360px; overflow-y: auto; }
.think .body.md p, .think .body.md ul, .think .body.md ol { margin: 0 0 6px; }
.think .body.md li { margin: 2px 0; }
.think .body.md h1, .think .body.md h2, .think .body.md h3, .think .body.md h4 { font-size: 1em; margin: 10px 0 4px; }
.think summary:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 3px; }
/* Passaggi intermedi dell'assistente (ragionamento prima di uno strumento, esito dello strumento): compatti e vicini */
.msg.step + .msg { margin-top: -18px; }
.msg.step .think { margin-bottom: 0; }
.think.live summary span { background: linear-gradient(90deg, var(--text-3) 30%, var(--text) 50%, var(--text-3) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.typing { display: inline-flex; gap: 4px; padding: 10px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: bounce 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

.err-box { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--err-soft); color: var(--err); font-size: 14px; border: 1px solid color-mix(in oklch, var(--err) 25%, transparent); }

/* markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md blockquote, .md table, .md .codeblock, .md .katex-display { margin: 0 0 14px; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; letter-spacing: -0.015em; margin: 26px 0 10px; font-weight: 600; text-wrap: balance; }
.md h1 { font-size: 1.5em; } .md h2 { font-size: 1.28em; } .md h3 { font-size: 1.1em; } .md h4 { font-size: 1em; }
.md ul, .md ol { padding-left: 1.5em; } .md li { margin: 4px 0; } .md li > p { margin: 0 0 6px; }
.md li::marker { color: var(--text-3); }
.md a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.md strong { font-weight: 600; }
.md blockquote { margin-left: 0; padding-left: 14px; border-left: 1px solid var(--border-strong); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
.md :not(pre) > code { font-size: .88em; background: var(--code-bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 6px; }
.md .tbl { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--border); border-radius: 12px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 0; font-variant-numeric: tabular-nums; }
.md th, .md td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
.md tr:last-child td { border-bottom: 0; }
.md th { font-weight: 600; background: var(--code-bg); }
.md img { max-width: 100%; border-radius: 12px; }
.md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.codeblock { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--code-bg); }
.codeblock .ch { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 6px 0 14px; font-size: 12px; color: var(--text-3); border-bottom: 1px solid var(--border); font-family: "Geist Mono", monospace; }
.codeblock .ch button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; font-size: 12px; color: var(--text-2); font-family: "Geist", sans-serif; }
.codeblock .ch button:hover { background: var(--hover); color: var(--text); }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.6; tab-size: 4; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-template-tag { color: var(--hl-str); }
.hljs-number, .hljs-symbol, .hljs-bullet, .hljs-variable.constant_ { color: var(--hl-num); }
.hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--hl-fn); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--hl-com); font-style: italic; }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-attr, .hljs-selector-class, .hljs-tag { color: var(--hl-type); }
.hljs-deletion { color: var(--err); }

/* empty / hero */
#hero { display: none; text-align: center; padding: 0 20px 28px; }
#hero h1 { font-size: clamp(24px, 4vw, 30px); letter-spacing: -0.025em; font-weight: 600; margin: 0 0 6px; line-height: 1.2; text-wrap: balance; }
#hero p { margin: 0; color: var(--text-2); font-size: 15px; }
#main.empty #scroller { flex: 0 0 auto; }
#main.empty #hero { display: block; }
#main.empty .center-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 12vh; }

/* composer */
.center-wrap { display: flex; flex-direction: column; min-height: 0; flex: none; }
#main:not(.empty) .center-wrap { flex: 1; }
.composer-wrap { padding: 0 16px calc(12px + env(safe-area-inset-bottom)); flex: none; }
.composer {
  max-width: 780px; margin: 0 auto; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 24px;
  box-shadow: 0 6px 24px -10px oklch(0.2 0.02 260 / 0.18); transition: border-color .15s, box-shadow .15s;
}
.composer:focus-within { border-color: color-mix(in oklch, var(--text) 30%, var(--border-strong)); }
.composer.drag { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.composer textarea {
  display: block; width: 100%; border: 0; background: transparent; resize: none; padding: 14px 18px 4px; font-size: 16px; line-height: 1.5;
  max-height: 40dvh; min-height: 52px;
}
.composer textarea:focus { outline: none; }
.composer textarea::placeholder { color: var(--text-3); }
.attachments { display: flex; gap: 8px; padding: 12px 14px 0; flex-wrap: wrap; }
.att { position: relative; width: 64px; height: 64px; }
.att img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); }
.att button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--primary-bg); color: var(--primary-fg); display: grid; place-items: center; }
.att button .i { width: 12px; height: 12px; stroke-width: 2.5; }
.composer-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 10px; }
.composer-bar .grow { flex: 1; }
.toggle {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; font-size: 13.5px; font-weight: 500;
  border: 1px solid var(--border-strong); color: var(--text-2); transition: all .15s;
}
.toggle:hover { background: var(--hover); color: var(--text); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in oklch, var(--accent) 45%, transparent); color: var(--accent); }
.send {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-bg); color: var(--primary-fg);
  transition: opacity .15s, transform .15s;
}
.send:disabled { opacity: .25; }
.send:not(:disabled):active { transform: scale(.94); }
.send .i { stroke-width: 2.25; }
.send .stop { width: 12px; height: 12px; border-radius: 3px; background: currentColor; }
.hint { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--text-3); min-height: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.hint .btn { height: 26px; font-size: 12px; padding: 0 10px; }

#toBottom {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; width: 36px; height: 36px; border-radius: 50%;
  background: var(--raised); border: 1px solid var(--border-strong); display: grid; place-items: center; box-shadow: var(--shadow); color: var(--text-2); z-index: 5;
}
/* account e impostazioni */
.acct { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; height: 40px; padding: 0 6px; border-radius: 10px; text-align: left; }
.acct:hover { background: var(--hover); }
.acct .nm { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .rl { font-size: 12px; color: var(--text-3); }
:root { --av-bg: 0.91; --av-fg: 0.42; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --av-bg: 0.34; --av-fg: 0.87; } }
:root[data-theme="dark"] { --av-bg: 0.34; --av-fg: 0.87; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--active); color: var(--text); font-weight: 600; font-size: 13px; text-transform: uppercase; }
.avatar.c { background: oklch(var(--av-bg) 0.07 var(--h)); color: oklch(var(--av-fg) 0.12 var(--h)); }
.avatar.dashed { background: transparent; border: 1.5px dashed oklch(var(--av-fg) 0.12 var(--h)); }
.person .avatar { width: 38px; height: 38px; font-size: 15px; }
.avatar.xl { width: 56px; height: 56px; font-size: 22px; }
#settings { display: none; flex: 1; overflow-y: auto; }
#main.settings-open #settings { display: block; }
#main.settings-open .center-wrap, #main.settings-open #toBottom, #main.settings-open #modelBtn { display: none; }
.set-wrap { max-width: 720px; margin: 0 auto; padding: 4px 20px 72px; }
.set-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; }
.set-head h1 { font-size: 28px; letter-spacing: -0.03em; font-weight: 600; margin: 0; line-height: 1.2; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
.tab { height: 42px; padding: 0 14px; font-weight: 500; font-size: 14.5px; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--text); }
.set-body { display: grid; gap: 16px; }
.card { background: var(--raised); border: 1px solid var(--border); border-radius: 18px; padding: 22px 22px 24px; }
.card.flush { padding: 0; overflow: hidden; }
.card-head { margin-bottom: 18px; }
.card-head.pad { padding: 20px 22px 16px; margin: 0; }
.card-head h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.card-head p { margin: 0; color: var(--text-2); font-size: 14px; max-width: 60ch; }
.count { font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--hover); border-radius: 99px; padding: 1px 8px; }
.row-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.row-card .card-head { margin: 0; }
.profile { display: flex; align-items: center; gap: 16px; }
.p-name { font-size: 19px; font-weight: 600; display: flex; gap: 10px; align-items: center; letter-spacing: -0.015em; flex-wrap: wrap; }
.p-sub { color: var(--text-2); font-size: 14px; margin-top: 2px; }
.stack { display: grid; gap: 16px; max-width: 440px; }
.card .stack:has(.grid2) { max-width: none; }
.stack .field { margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field input, .field select { height: 42px; border-radius: 10px; font-size: 15px; }
.field-hint { font-size: 12.5px; color: var(--text-3); }
.form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.form-msg { font-size: 14px; color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.form-msg:empty { display: none; }
.form-msg.err { color: var(--err); }
.form-msg.ok { color: var(--ok); }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; border-radius: 12px; background: var(--hover); gap: 2px; justify-self: start; }
.seg button { height: 34px; padding: 0 14px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 3px oklch(0.2 0.02 260 / 0.16); }
.person { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.person.off .who, .person.off .avatar { opacity: .55; }
.person .who { flex: 1; min-width: 0; }
.who .t { font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.who .s { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .acts { display: flex; gap: 2px; }
.danger-ic:hover { color: var(--err); }
.danger-ic.confirm { width: auto; padding: 0 10px; background: var(--err); color: var(--primary-fg); font-size: 12.5px; font-weight: 600; }
.danger-ic.confirm:hover { background: var(--err); color: var(--primary-fg); }
.p-out { flex-basis: 100%; }
.p-out:empty { display: none; }
.badge { font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--hover); color: var(--text-2); }
.badge.admin { background: var(--accent-soft); color: var(--accent); }
.badge.off { background: var(--err-soft); color: var(--err); }
.result { border: 1px solid var(--border); background: var(--code-bg); border-radius: 14px; padding: 14px 16px; font-size: 14px; }
.result.ok { border-color: color-mix(in oklch, var(--ok) 35%, var(--border)); }
.r-title { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.r-title b { font-weight: 600; }
.result.ok .r-title { color: var(--ok); }
.r-sub { color: var(--text-2); margin-top: 4px; }
.linkrow { display: flex; gap: 8px; margin-top: 12px; }
.linkrow input { flex: 1; min-width: 0; height: 34px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--raised); padding: 0 10px; font-family: "Geist Mono", monospace; font-size: 12.5px; }
.list-empty { padding: 18px 22px; color: var(--text-3); font-size: 14px; }
@media (max-width: 820px) {
  .grid2 { grid-template-columns: 1fr; }
  .card { padding: 18px 16px 20px; }
  .card-head.pad { padding: 18px 16px 14px; }
  .person { padding: 12px 16px; }
  .set-head h1 { font-size: 24px; }
}

/* dettatura */
.rec-bar { display: none; align-items: center; gap: 10px; padding: 10px 10px 10px 18px; min-height: 60px; }
.composer.recording .rec-bar, .composer.transcribing .rec-bar { display: flex; }
.composer.recording textarea, .composer.recording .composer-bar, .composer.recording .attachments,
.composer.transcribing textarea, .composer.transcribing .composer-bar, .composer.transcribing .attachments { display: none !important; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); flex: none; animation: pulse 1.2s ease-in-out infinite; }
.rec-wave { flex: 1; min-width: 0; height: 36px; display: block; }
.rec-time { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
.rec-status { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 14.5px; }
.rec-ok { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-bg); color: var(--primary-fg); flex: none; }
.rec-ok .i { stroke-width: 2.4; }
#micBtn:disabled, #voiceBtn:disabled { opacity: .4; }
.rec-live { display: none; padding: 12px 18px 0; color: var(--text-2); font-size: 15px; line-height: 1.5; max-height: 30dvh; overflow-y: auto; overflow-wrap: anywhere; }
.composer.recording .rec-live:not(:empty), .composer.transcribing .rec-live:not(:empty) { display: block; }

/* conversazione a voce: al posto della casella, il cerchio che ascolta e parla */
.voice-bar { display: none; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; min-height: 68px; }
.composer.voice-on .voice-bar { display: flex; }
.composer.voice-on textarea, .composer.voice-on .composer-bar, .composer.voice-on .attachments,
.composer.voice-on .rec-bar, .composer.voice-on .rec-live { display: none !important; }
.voice-orb { --lv: 0; position: relative; width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.voice-orb span { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in oklch, var(--accent) 55%, white), var(--accent));
  transform: scale(calc(0.78 + var(--lv) * 0.9)); transition: transform .08s linear; box-shadow: 0 0 0 calc(var(--lv) * 14px) var(--accent-soft); }
.voice-orb.thinking span, .voice-orb.transcribing span { transform: scale(.7); animation: orbThink 1.1s ease-in-out infinite; }
.voice-orb.speaking span { animation: orbTalk .9s ease-in-out infinite; }
.voice-orb.paused span { transform: scale(.7); background: var(--border-strong); }
@keyframes orbThink { 50% { transform: scale(.82); opacity: .6; } }
@keyframes orbTalk { 0%, 100% { transform: scale(.82); } 50% { transform: scale(1); } }
.voice-tx { flex: 1; min-width: 0; display: grid; gap: 1px; }
.voice-tx b { font-size: 14.5px; font-weight: 600; }
.voice-tx span { font-size: 13.5px; color: var(--text-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; }

/* scheda del sito del locale: stessi colori, caratteri e impaginazione del menu online */
.site-view { --sv-cream: #F7EED8; --sv-green: #183e2d; --sv-olive: #58792c; --sv-paper: #fffbef; --sv-mute: #6f7d67;
  background: var(--sv-cream); color: var(--sv-green); border-radius: 16px; padding: 14px 20px 18px; margin-top: 8px;
  font: 16px/1.6 Arial, Helvetica, sans-serif; max-width: 100%; }
.site-view ::selection { background: #d5e88b; color: var(--sv-green); }
.sv-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .66rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--sv-olive); }
.sv-head a { color: var(--sv-green); text-decoration: none; font-size: .78rem; font-weight: 700; letter-spacing: 0; text-transform: none; border-bottom: 1px solid #183e2d40; }
.sv-head a:hover { border-color: var(--sv-green); }
.sv-section-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid #183e2d40; padding: 16px 0 10px; }
.sv-section-title h2 { margin: 0; font-size: 1.45rem; line-height: 1.15; letter-spacing: -.045em; font-weight: 750; }
.sv-section-title span { font-size: .6rem; font-weight: 800; letter-spacing: .14em; color: var(--sv-mute); white-space: nowrap; }
.sv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.sv-card { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-bottom: 1px dashed #183e2d24; align-items: start; }
.sv-card.no-photo { grid-template-columns: minmax(0, 1fr); }
.sv-card.off .sv-photo, .sv-card.off .sv-body > :not(.sv-badges) { opacity: .5; }
.sv-photo { aspect-ratio: 1; border-radius: 7px; overflow: hidden; background: #e9e9d9; margin-top: 2px; }
.sv-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sv-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.sv-badge { background: #e3edcb; color: #294b27; font-size: .64rem; font-weight: 700; border-radius: 3px; padding: 2px 7px; line-height: 1.5; }
.sv-badge.off { background: var(--sv-green); color: var(--sv-cream); }
.sv-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sv-title h3 { margin: 0; font-size: 1.02rem; line-height: 1.25; letter-spacing: -.02em; font-weight: 700; }
.sv-title > strong { white-space: nowrap; font-size: .9rem; }
.sv-id { font-size: .62rem; font-weight: 500; color: #8a9585; letter-spacing: 0; margin-left: 4px; }
.sv-wine { display: grid; gap: 1px; min-width: 100px; text-align: right; line-height: 1.3; font-size: .68rem; color: #586358; }
.sv-wine span { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
.sv-wine strong { color: var(--sv-green); font-size: .8rem; }
.sv-body p { margin: 6px 0; font-size: .82rem; line-height: 1.55; color: #2c4a38; }
.sv-allergens { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 6px; }
.sv-allergens b { font-size: .56rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--sv-mute); margin-right: 2px; }
.sv-allergens span { font-size: .66rem; font-weight: 600; line-height: 1.35; padding: 2px 9px; border: 1px solid #183e2d33; border-radius: 99px; color: #2c4a38; background: #fffbef99; white-space: nowrap; }
.sv-daymenu { position: relative; margin: 12px 0 4px; padding: 24px 26px 18px; border: 1px solid #183e2d33; border-radius: 12px; background: var(--sv-paper); box-shadow: 0 14px 34px #183e2d12; }
.sv-daymenu::before { content: ''; position: absolute; inset: 7px; border: 1px solid #183e2d14; border-radius: 8px; pointer-events: none; }
.sv-dm-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid #183e2d26; }
.sv-dm-head .sv-eyebrow { display: block; margin-bottom: 6px; font-size: .66rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--sv-olive); }
.sv-dm-head h3 { margin: 0; font-size: 1.9rem; line-height: 1; letter-spacing: -.05em; font-weight: 750; }
.sv-dm-price { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
.sv-dm-price strong { padding: 5px 13px; border-radius: 99px; background: var(--sv-green); color: #d5e88b; font-size: 1.1rem; letter-spacing: -.02em; white-space: nowrap; }
.sv-dm-price span { font-size: .75rem; color: #4d654d; }
.sv-course h4 { margin: 16px 0 4px; font-size: .62rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--sv-olive); display: flex; align-items: center; gap: 10px; }
.sv-course h4::after { content: ''; flex: 1; height: 1px; background: #183e2d1f; }
.sv-dish { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 7px 0; }
.sv-dish + .sv-dish { border-top: 1px dashed #183e2d24; }
.sv-dish b { display: block; font-size: 1.05rem; line-height: 1.25; letter-spacing: -.03em; }
.sv-dish p { margin: 3px 0 0; font-size: .85rem; line-height: 1.5; }
.sv-dish strong { white-space: nowrap; font-size: .92rem; }
.sv-dm-foot { margin: 14px 0 0; padding-top: 10px; border-top: 1px solid #183e2d1a; font-size: .72rem; color: #6d7b66; }
.sv-unpub { display: inline-block; vertical-align: middle; margin-left: 8px; font-size: .62rem; font-weight: 700; letter-spacing: 0; background: var(--sv-green); color: var(--sv-cream); padding: 2px 8px; border-radius: 3px; }

/* scratchpad della Homebase: stessi colori (blu notte e ambra) e stessa struttura */

  box-shadow: 0 12px 30px -18px rgba(0,0,0,.6); }

.hbsp-ic { color: var(--sp-amber); display: inline-flex; }

.hbsp-act { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--sp-line); color: #cbd5e1; font-size: 12.5px; text-decoration: none; background: var(--sp-soft); }

.hbsp-text { padding: 14px 16px 18px; font-size: 14px; line-height: 1.6; max-height: 420px; overflow-y: auto; overflow-wrap: anywhere; }

/* da Aura: e' lui a scriverti */

<div id="login" class="auth hidden">
  <aside class="auth-art" aria-hidden="true"></aside>
  <div class="auth-main">
  <form class="login-box" id="loginForm" novalidate>
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 7.5A7 7 0 1 0 17.4 16.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span>Cerini IA</div>
    <h1>Bentornato</h1>
    <p>Accedi per continuare le tue conversazioni.</p>
    <div class="field"><label for="u">Utente</label><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="p">Password</label><div class="pw-wrap"><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" data-for="p" aria-label="Mostra password"></button></div></div>
    <button class="btn primary" type="submit" id="loginBtn">Accedi</button>
    <div class="form-err" id="loginErr" role="alert"></div>
    <p class="auth-legal">Assistente personale privato, solo su invito · <a href="/privacy">Privacy</a></p>
  </form>
  </div>
</div>

<!-- ============================================================== invito -->
<div id="invite" class="auth hidden">
  <aside class="auth-art" aria-hidden="true"></aside>
  <div class="auth-main">
  <form class="login-box" id="inviteForm" novalidate>
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 7.5A7 7 0 1 0 17.4 16.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span>Cerini IA</div>
    <h1 id="invTitle">Benvenuto</h1>
    <p id="invSub">Scegli la password per entrare.</p>
    <div id="invFields">
      <input type="text" name="username" id="invUser" autocomplete="username" hidden>
      <div class="field"><label for="ip1">Password (almeno 10 caratteri)</label><div class="pw-wrap"><input id="ip1" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="pw-toggle" data-for="ip1" aria-label="Mostra password"></button></div></div>
      <div class="field"><label for="ip2">Ripeti la password</label><input id="ip2" type="password" autocomplete="new-password" required></div>
      <button class="btn primary" type="submit" id="invBtn">Entra</button>
    </div>
    <div class="form-err" id="invErr" role="alert"></div>
  </form>
  </div>
</div>

<!-- ================================================================= app -->
<div id="app" class="hidden">
  <aside id="side" aria-label="Conversazioni">
    <div class="side-top">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 7.5A7 7 0 1 0 17.4 16.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span>Cerini IA</div>
      <button class="icon-btn" id="sideClose" title="Chiudi barra laterale" aria-label="Chiudi barra laterale" data-icon="panel"></button>
    </div>
    <button class="new-chat" id="newChat"><span data-icon="edit"></span>Nuova chat<kbd>Ctrl ⇧ O</kbd></button>
    <button class="side-link" id="auraBtn"><span data-icon="bell"></span>Da Aura<span class="n" id="auraCount"></span></button>
    <button class="side-link" id="memoryBtn"><span data-icon="brain"></span>Memoria<span class="n" id="memoryCount"></span></button>
    <button class="side-link hidden" id="mailBtn"><span data-icon="mail"></span>Posta<span class="n" id="mailCount"></span></button>
    <button class="side-link hidden" id="agendaBtn"><span data-icon="calendar"></span>Agenda</button>
    <nav id="chatList"></nav>
    <div class="side-foot">
      <div class="foot-actions">
        <button class="acct" id="accountBtn" title="Impostazioni e account"><span class="avatar" id="avatar"></span><span style="min-width:0"><div class="nm" id="userName"></div><div class="rl" id="userRole"></div></span></button>
        <button class="icon-btn sm" id="themeBtn" title="Tema" aria-label="Cambia tema"></button>
        <button class="icon-btn sm" id="logoutBtn" title="Esci" aria-label="Esci" data-icon="logout"></button>
      </div>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main" class="empty">
    <div class="topbar">
      <button class="icon-btn" id="sideOpen" title="Apri barra laterale" aria-label="Apri barra laterale" data-icon="panel"></button>
      <button id="modelBtn" aria-haspopup="listbox" aria-expanded="false"><span class="dot" id="modelDot"></span><span class="name" id="modelName">Modello</span><span data-icon="chevron"></span></button>
      <button id="projChip" class="proj-chip hidden" aria-label="Apri la scheda del progetto"></button>
      <div class="grow"></div>
      <button id="calChip" class="cal-chip hidden" aria-label="Apri l'agenda"></button>
      <button class="icon-btn" id="brainToggle" title="Cervello: diario, wiki e skill" aria-label="Apri il cervello" data-icon="brain"></button>
      <button class="icon-btn" id="newChatTop" title="Nuova chat" aria-label="Nuova chat" data-icon="edit"></button>
    </div>
    <div id="picker" class="hidden" role="listbox" aria-label="Modelli"></div>

    <div class="center-wrap">
      <div id="scroller"><div id="thread" aria-live="polite"></div></div>
      <div id="hero"><h1 id="heroTitle">Di cosa hai bisogno?</h1><p id="heroSub"></p></div>
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <div class="attachments hidden" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Scrivi ad Aura" aria-label="Messaggio"></textarea>
          <div class="composer-bar">
            <button type="button" class="icon-btn" id="attachBtn" title="Allega file o immagini" aria-label="Allega file" data-icon="clip"></button>
            <button type="button" class="toggle hidden" id="thinkBtn" aria-pressed="false"><span data-icon="bulb"></span>Ragiona</button>
            <div class="grow"></div>
            <button type="button" class="icon-btn hidden" id="micBtn" title="Detta (parla e trascrivo)" aria-label="Detta un messaggio" data-icon="mic"></button>
            <button type="button" class="icon-btn hidden" id="voiceBtn" title="Conversa a voce con Aura" aria-label="Conversazione a voce" data-icon="waves"></button>
            <button type="submit" class="send" id="sendBtn" aria-label="Invia" disabled></button>
          </div>
          <div class="rec-live" id="recLive" aria-live="polite"></div>
          <div class="rec-bar" id="recBar" aria-live="polite"></div>
          <div class="voice-bar" id="voiceBar"></div>
          <input type="file" id="fileInput" multiple hidden>
        </form>
        <div class="hint" id="hint"></div>
      </div>
    </div>
    <section id="settings" aria-label="Impostazioni"></section>
    <section id="memoryView" aria-label="Memoria"></section>
    <section id="mailView" aria-label="Posta"></section>
    <section id="agendaView" aria-label="Agenda"></section>
    <section id="auraView" aria-label="Da Aura"></section>
    <section id="brainView" aria-label="Cervello"></section>
    <button id="toBottom" class="hidden" aria-label="Vai in fondo" data-icon="down"></button>
  </main>
  <aside id="brainPanel" aria-label="Cervello"></aside>
  <div id="brainScrim"></div>
</div>
<div id="toast" role="status"></div>

</body>
</html>
